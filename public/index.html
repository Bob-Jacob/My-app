<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #7bb0c9; color: #1c1c1c;
    }
    .card {
      background: #fff; width: min(420px, 92vw); padding: 28px; border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .sub { margin: 0 0 20px; color: #666; font-size: .9rem; }
    label { display: block; font-size: .8rem; color: #555; margin-top: 14px; }
    .value { font-size: 1.05rem; margin-top: 2px; min-height: 1.4em; }
    input, textarea {
      width: 100%; padding: 9px 10px; margin-top: 4px; font: inherit;
      border: 1px solid #bbb; border-radius: 8px;
    }
    button {
      margin-top: 22px; padding: 10px 18px; font: inherit; cursor: pointer;
      border: 0; border-radius: 8px; background: #2a7fa5; color: #fff;
    }
    button.secondary { background: #e3e3e3; color: #222; margin-left: 8px; }
    #status { margin-top: 14px; font-size: .85rem; color: #2a7a2a; min-height: 1.2em; }
    #status.error { color: #b00020; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>User Profile</h1>
    <p class="sub">Served by Node.js · stored in MongoDB</p>

    <!-- View mode -->
    <div id="view">
      <label>Name</label><div class="value" id="v-name"></div>
      <label>Email</label><div class="value" id="v-email"></div>
      <label>Interests</label><div class="value" id="v-interests"></div>
      <button id="edit-btn">Edit profile</button>
    </div>

    <!-- Edit mode -->
    <form id="edit" class="hidden">
      <label>Name</label><input id="i-name" />
      <label>Email</label><input id="i-email" type="email" />
      <label>Interests</label><textarea id="i-interests" rows="3"></textarea>
      <button type="submit">Save</button>
      <button type="button" class="secondary" id="cancel-btn">Cancel</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let profile = {};

    function setStatus(msg, isError = false) {
      $("status").textContent = msg;
      $("status").className = isError ? "error" : "";
    }

    function render() {
      $("v-name").textContent = profile.name || "—";
      $("v-email").textContent = profile.email || "—";
      $("v-interests").textContent = profile.interests || "—";
    }

    function showEdit(on) {
      $("view").classList.toggle("hidden", on);
      $("edit").classList.toggle("hidden", !on);
    }

    async function loadProfile() {
      try {
        const res = await fetch("/get-profile");
        if (!res.ok) throw new Error("Server returned " + res.status);
        profile = await res.json();
        render();
      } catch (err) {
        setStatus("Could not load profile: " + err.message, true);
      }
    }

    $("edit-btn").addEventListener("click", () => {
      $("i-name").value = profile.name || "";
      $("i-email").value = profile.email || "";
      $("i-interests").value = profile.interests || "";
      setStatus("");
      showEdit(true);
    });

    $("cancel-btn").addEventListener("click", () => showEdit(false));

    $("edit").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const res = await fetch("/update-profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: $("i-name").value,
            email: $("i-email").value,
            interests: $("i-interests").value,
          }),
        });
        if (!res.ok) throw new Error("Server returned " + res.status);
        profile = await res.json();
        render();
        showEdit(false);
        setStatus("Saved to MongoDB ✓");
      } catch (err) {
        setStatus("Could not save: " + err.message, true);
      }
    });

    loadProfile();
  </script>
</body>
</html>
